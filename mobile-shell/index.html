<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ASTERIAL</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050507;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #0e0e13;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 16px;
        letter-spacing: 0.22em;
        font-weight: 600;
      }
      p {
        margin-top: 8px;
        font-size: 12px;
        color: #9e9ea9;
      }
      .pulse {
        margin-top: 24px;
        width: 120px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .pulse::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        background: #f4f4f6;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(240%);
        }
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <path
          d="M16 4.5L18.4 13.6L27.5 16L18.4 18.4L16 27.5L13.6 18.4L4.5 16L13.6 13.6L16 4.5Z"
          fill="#FFFFFF"
        />
      </svg>
    </div>
    <h1>ASTERIAL</h1>
    <p>Establishing encrypted HTTPS session…</p>
    <div class="pulse"></div>
    <script>
      window.location.replace("https://asterial.vercel.app/app/chats");
    </script>
  </body>
</html>
