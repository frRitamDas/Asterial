<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ASTERIAL — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        background: #050507;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        padding: calc(32px + env(safe-area-inset-top, 0px)) 24px
          calc(28px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      .spacer {
        height: 16px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #0e0e13;
        padding: 28px 24px;
      }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: #09090d;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      .badge {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #fbbf24;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.25);
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin-top: 10px;
        font-size: 13px;
        line-height: 1.55;
        color: #9e9ea9;
      }
      button {
        margin-top: 22px;
        width: 100%;
        height: 44px;
        border-radius: 12px;
        border: none;
        background: #ffffff;
        color: #09090b;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.86;
      }
      .status {
        margin-top: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #63636e;
      }
      footer {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #63636e;
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <path
            d="M16 4.5L18.4 13.6L27.5 16L18.4 18.4L16 27.5L13.6 18.4L4.5 16L13.6 13.6L16 4.5Z"
            fill="#FFFFFF"
          />
          <circle
            cx="16"
            cy="16"
            r="6.2"
            stroke="#FFFFFF"
            stroke-opacity="0.32"
            stroke-width="1"
          />
        </svg>
      </div>
      <div><span class="badge">Network Offline</span></div>
      <h1>Unable to reach ASTERIAL</h1>
      <p>
        Check your Wi-Fi or mobile data connection. Your session and messages
        remain safely stored and will synchronize automatically once
        connectivity returns.
      </p>
      <button id="retry-btn" type="button">Reconnect to ASTERIAL</button>
      <div id="status-line" class="status">Waiting for network signal…</div>
    </div>
    <footer>ASTERIAL · Developer: Ritam Das · By X Huracan</footer>

    <script>
      var targetUrl = "https://asterial.vercel.app/app/chats";
      var btn = document.getElementById("retry-btn");
      var statusLine = document.getElementById("status-line");

      function attemptReconnect() {
        statusLine.textContent = "Connecting to asterial.vercel.app…";
        window.location.replace(targetUrl);
      }

      btn.addEventListener("click", attemptReconnect);
      window.addEventListener("online", function () {
        statusLine.textContent = "Network detected — reconnecting…";
        setTimeout(attemptReconnect, 350);
      });
    </script>
  </body>
</html>
